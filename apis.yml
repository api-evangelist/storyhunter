aid: storyhunter
name: Glimmer (formerly Storyhunter)
description: Glimmer, formerly known as Storyhunter, is an all-in-one creator management
  platform and global marketplace connecting brands and media companies with a vetted
  network of 50,000+ freelance content creators, video producers, and journalists across
  170+ countries. Founded in 2012 by Jaron Gilinsky in Brooklyn, New York, and rebranded
  from Storyhunter to Glimmer in November 2023, the platform organizes creator teams,
  messaging, project management, online contracts, and global payments in one central
  dashboard, and offers Glimmer Select as a full-service managed production studio. Clients
  have included CNN, The New York Times, National Geographic, MSNBC, and Starbucks. The
  company was backed in part by 500 Global and is surfaced here as an API Evangelist
  network company profile; it does not publish a public developer API.
